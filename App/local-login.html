<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odinote — Iniciar sesión con Google</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #FAF9F6;
      --ink: #1A1A1A;
      --line: #595459;
      --olive: #6A8546;
      --line-soft: #E5E1DD;
      --wine: #E6544F;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 6px 6px 0px var(--line);
      text-align: center;
      margin: auto;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    p {
      font-size: 14px;
      color: #595459;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      background: #FFFFFF;
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--line);
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-google:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--line);
    }

    .btn-google:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--line);
    }

    .status-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .status-icon {
      font-size: 48px;
      color: var(--olive);
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .status-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--olive);
    }

    .error-card {
      display: none;
      padding: 12px;
      background: rgba(230, 84, 79, 0.1);
      border: 1.5px solid #E6544F;
      border-radius: 8px;
      font-size: 13px;
      color: #E6544F;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <h1 class="logo-title">Odinote</h1>
    </div>

    <div id="auth-flow">
      <h2>Vincular con Google</h2>
      <p>Inicia sesión con tu cuenta de Google para autorizar y conectar tu perfil en la aplicación de escritorio.</p>
      
      <div id="error-box" class="error-card"></div>

      <button id="btn-login" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.8 2.17c1.64-1.51 2.59-3.74 2.59-6.5z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.8-2.17c-.78.52-1.78.83-3.16.83-2.43 0-4.49-1.64-5.22-3.85H.91v2.24C2.4 15.82 5.5 18 9 18z"/>
          <path fill="#FBBC05" d="M3.78 10.63c-.19-.57-.3-1.18-.3-1.8s.11-1.23.3-1.8V4.78H.91C.33 5.93 0 7.23 0 8.63s.33 2.7 1.01 3.85l2.77-2.22z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47 1.09 11.43 0 9 0 5.5 0 2.4 2.18.91 5.16l2.87 2.24C4.51 5.22 6.57 3.58 9 3.58z"/>
        </svg>
        <span>Iniciar sesión con Google</span>
      </button>
    </div>

    <div id="status-flow" class="status-card">
      <span class="material-symbols-rounded status-icon">check_circle</span>
      <div class="status-text">¡Sincronizado con éxito!</div>
      <p style="margin: 0; font-size: 13px; color: #595459;">Ya puedes regresar a la aplicación de Odinote, esta pestaña se actualizará automáticamente.</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBe-E7K19JD5OYQpyzS773rjuegR07Y1GU",
      authDomain: "odinote-firebase.firebaseapp.com",
      projectId: "odinote-firebase",
      storageBucket: "odinote-firebase.firebasestorage.app",
      messagingSenderId: "160850813780",
      appId: "1:160850813780:web:8e80553294301232ac5ec1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const authFlow = document.getElementById('auth-flow');
    const statusFlow = document.getElementById('status-flow');
    const errorBox = document.getElementById('error-box');
    const btnLogin = document.getElementById('btn-login');

    btnLogin.addEventListener('click', () => {
      errorBox.style.display = "none";
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          const profile = {
            name: user.displayName || 'Google User',
            email: user.email,
            picture: user.photoURL || 'G'
          };

          fetch('/auth-success', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(profile)
          })
          .then(res => {
            if (res.ok) {
              authFlow.style.display = "none";
              statusFlow.style.display = "flex";
            } else {
              throw new Error("No se pudo notificar a la app de escritorio.");
            }
          })
          .catch((err) => {
            console.error(err);
            errorBox.innerText = "Error al comunicar con la app local: " + err.message;
            errorBox.style.display = "block";
          });
        })
        .catch((err) => {
          console.error(err);
          errorBox.innerText = "Error: " + err.message;
          errorBox.style.display = "block";
        });
    });
  </script>
</body>
</html>
