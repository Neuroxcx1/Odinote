    <!-- Pantalla de carga: CSS puro, se muestra al instante (antes de que Babel
         transpile los .jsx) y evita el destello blanco. La quita __hideSplash. -->
    <style>
      #odi-splash {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F4F3EF;
        transition: opacity 550ms ease;
        overflow: hidden; font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      }
      #odi-splash.odi-dark { background: #232123; }
      #odi-splash .odi-aura {
        position: absolute; width: 340px; height: 340px; border-radius: 50%;
        background: radial-gradient(circle, rgba(144,185,104,0.45) 0%, rgba(144,185,104,0.12) 45%, transparent 70%);
        filter: blur(6px); animation: odi-aura-pulse 3.2s ease-in-out infinite;
      }
      #odi-splash.odi-dark .odi-aura {
        background: radial-gradient(circle, rgba(144,185,104,0.5) 0%, rgba(106,133,70,0.18) 45%, transparent 70%);
      }
      @keyframes odi-aura-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      #odi-splash .odi-logo {
        position: relative; z-index: 2; width: 128px; height: 128px; object-fit: contain;
        filter: drop-shadow(0 6px 20px rgba(106,133,70,0.35));
        animation: odi-logo-float 3.6s ease-in-out infinite;
      }
      @keyframes odi-logo-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-9px) scale(1.03); }
      }
      #odi-splash .odi-word {
        position: relative; z-index: 2; margin-top: 22px;
        font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: #1A1A1A;
      }
      #odi-splash.odi-dark .odi-word { color: #F0EEF0; }
      #odi-splash .odi-dots { position: relative; z-index: 2; display: flex; gap: 7px; margin-top: 18px; }
      #odi-splash .odi-dots i {
        width: 8px; height: 8px; border-radius: 50%; background: #90B968; display: block;
        animation: odi-dot 1.2s ease-in-out infinite;
      }
      #odi-splash .odi-dots i:nth-child(2) { background: #E6544F; animation-delay: 0.18s; }
      #odi-splash .odi-dots i:nth-child(3) { background: #595459; animation-delay: 0.36s; }
      #odi-splash.odi-dark .odi-dots i:nth-child(3) { background: #A5A1A5; }
      @keyframes odi-dot {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
      /* Triángulos flotantes de marca */
      #odi-splash .odi-tri {
        position: absolute; width: 0; height: 0; opacity: 0.5;
        animation: odi-tri-float 7s ease-in-out infinite;
      }
      @keyframes odi-tri-float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.35; }
        50% { transform: translateY(-16px) rotate(22deg); opacity: 0.65; }
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar Odinote.</noscript>

    <div id="odi-splash">
      <div class="odi-aura"></div>
      <span class="odi-tri" style="top:26%; left:30%; border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:19px solid #90B968; animation-delay:0s;"></span>
      <span class="odi-tri" style="top:34%; left:66%; border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:14px solid #E6544F; animation-delay:1.1s;"></span>
      <span class="odi-tri" style="top:64%; left:38%; border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:15px solid #595459; animation-delay:2.2s;"></span>
      <span class="odi-tri" style="top:60%; left:62%; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:12px solid #F7DA84; animation-delay:0.6s;"></span>
      <span class="odi-tri" style="top:22%; left:52%; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid #90B968; animation-delay:3.1s;"></span>
      <img class="odi-logo" src="./Icon/Icon.png" alt="Odinote"/>
      <div class="odi-word">Odinote</div>
      <div class="odi-dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      // Aplicar tema guardado al splash para que no haya destello claro→oscuro
      try {
        if (localStorage.getItem('odinote.theme') === 'dark') {
          document.getElementById('odi-splash').classList.add('odi-dark');
        }
      } catch (e) {}
      // La app llama a esto cuando terminó de montar; respeta un mínimo visible
      window.__odiSplashStart = Date.now();
      window.__hideSplash = function () {
        var el = document.getElementById('odi-splash');
        if (!el) return;
        var elapsed = Date.now() - (window.__odiSplashStart || 0);
        var wait = Math.max(0, 900 - elapsed); // mínimo ~0.9s para que no parpadee
        setTimeout(function () {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 600);
        }, wait);
      };
      // Respaldo: si algo impidiera que la app llame a __hideSplash, quitarlo a los 12s
      setTimeout(function () {
        var el = document.getElementById('odi-splash');
        if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 600); }
      }, 12000);
    </script>
