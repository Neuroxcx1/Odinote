# Oddinote para Mac, compilado en un Mac de GitHub: un .dmg por procesador
# (arm64 para los chips de Apple, x64 para Intel).
#
# No hay un Mac a mano y la licencia de Apple no deja usar macOS fuera de sus
# ordenadores, así que la versión de Mac la compila GitHub en uno de los
# suyos cada vez que se publica una versión, y sube los .dmg a esa misma
# publicación junto al instalador de Windows, el APK y el AppImage. Desde la
# 1.2.2 no se reparten zips (lo pidió el usuario): un .dmg se abre y se
# arrastra a Aplicaciones, como cualquier programa de Mac.
#
# Antes de empaquetarlo, el código se deja ya traducido (scripts/precompila.js,
# como en Windows y Linux) y la app se ARRANCA aquí mismo para mirar en su
# registro que carga: si no carga, no se sube nada.
#
# Sale SIN FIRMAR: al abrirla, el Mac avisa de que es de un desarrollador no
# identificado y se abre con clic derecho → Abrir. Firmarla pide la cuenta de
# Apple Developer, que es del mantenedor.
#
# Para que entrar con Google funcione en esa versión, hace falta el secreto
# GOOGLE_OAUTH_JSON del repositorio (Settings → Secrets → Actions) con el
# contenido de App/google-oauth.json. Sin él compila igual, pero sin Google.
name: Mac

on:
  release:
    types: [published]
  # A mano (Actions → Mac → Run workflow). `etiqueta`: la publicación a la que
  # subir los .dmg (vacío = solo compilar, probar y dejarlos para descargar).
  # `version`: qué código compilar si no es el de la etiqueta (una etiqueta de
  # prueba, para probar antes de publicar sin subir main).
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Publicación a la que subir los .dmg (p. ej. v1.2.2); vacío = solo compilar y probar"
        required: false
        default: ""
      version:
        description: "Etiqueta o commit que compilar si no es el de la publicación (vacío = el de la publicación o main)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    # macos-15: GitHub retira macos-14 el 2026-11-02 (y antes lo apaga a ratos).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.event.release.tag_name || inputs.etiqueta || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm install y no npm ci: el package-lock.json no va en el repositorio
      # (está en .gitignore), y npm ci sin él no arranca.
      - name: Dependencias
        working-directory: App
        run: npm install --no-audit --no-fund

      - name: Credenciales de Google (si están)
        working-directory: App
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then
            printf '%s' "$GOOGLE_OAUTH_JSON" > google-oauth.json
            echo "google-oauth.json puesto"
          else
            echo "Sin GOOGLE_OAUTH_JSON: la versión de Mac saldrá sin entrar con Google"
          fi

      - name: Icono de Mac (.icns) a partir del de siempre
        working-directory: App
        run: |
          mkdir -p Icon/Oddinote.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Icon/Icon.png --out Icon/Oddinote.iconset/icon_${s}x${s}.png
            d=$((s * 2))
            sips -z $d $d Icon/Icon.png --out Icon/Oddinote.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns Icon/Oddinote.iconset -o Icon/Icon.icns

      - name: Compilar (Apple y Intel)
        working-directory: App
        run: npx electron-packager . Oddinote --platform=darwin --arch=arm64,x64 --out=dist/mac --overwrite --icon=Icon/Icon.icns --ignore="^/dist($|/)" --ignore="^/instalador($|/)"

      # El código ya traducido, como en Windows y Linux: arranca antes.
      - name: Código ya traducido
        working-directory: App
        run: |
          for d in dist/mac/Oddinote-darwin-*; do
            node scripts/precompila.js "$d/Oddinote.app/Contents/Resources/app"
          done

      # Se arranca la de este Mac (arm64) y se mira en su registro que carga.
      - name: Probar que arranca
        working-directory: App/dist/mac
        run: |
          perfil="$RUNNER_TEMP/perfil-oddinote"
          mkdir -p "$perfil"
          ./Oddinote-darwin-arm64/Oddinote.app/Contents/MacOS/Oddinote --user-data-dir="$perfil" &
          pid=$!
          sleep 40
          kill $pid 2>/dev/null || true
          echo "---- registro ----"
          head -60 "$perfil/odinote-debug.log" || true
          grep -q "Código cargado" "$perfil/odinote-debug.log"
          echo "La versión de Mac arranca y carga el código."

      - name: Un .dmg por procesador
        working-directory: App/dist/mac
        env:
          ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta || 'prueba' }}
        run: |
          version="$(node -p "require('../../package.json').version")"
          for d in Oddinote-darwin-*; do
            arq="${d#Oddinote-darwin-}"
            nombre="Oddinote-${version}-mac-${arq}.dmg"
            hdiutil create -volname "Oddinote" -srcfolder "$d/Oddinote.app" -ov -format UDZO "$nombre"
            echo "$nombre"
          done
          ls -la *.dmg

      - name: Subir a la publicación
        if: github.event_name == 'release' || inputs.etiqueta != ''
        working-directory: App/dist/mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.etiqueta }}" Oddinote-*-mac-*.dmg --clobber --repo "${{ github.repository }}"

      - name: Dejarlos para descargar (si se lanzó a mano sin etiqueta)
        if: github.event_name != 'release' && inputs.etiqueta == ''
        uses: actions/upload-artifact@v4
        with:
          name: oddinote-mac
          path: App/dist/mac/Oddinote-*-mac-*.dmg
